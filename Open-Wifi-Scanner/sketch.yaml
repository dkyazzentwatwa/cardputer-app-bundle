profiles:
  cardputer:
    fqbn: m5stack:esp32:m5stack_cardputer
    notes: M5Stack Cardputer profile matching the PlatformIO Cardputer app target.
    platforms:
      - platform: m5stack:esp32
        platform_index_url: https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
    libraries:
      - M5Cardputer (1.1.1)
      - FastLED (3.10.3)
      - dependency: M5Unified (0.2.15)
      - dependency: M5GFX (0.2.21)

default_profile: cardputer
