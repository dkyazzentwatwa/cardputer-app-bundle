profiles:
  cardputer:
    fqbn: m5stack:esp32:m5stack_cardputer:FlashSize=8M,PartitionScheme=custom,CDCOnBoot=cdc,USBMode=hwcdc
    notes: M5Stack Cardputer build with the repo-local 5 MB SPIFFS ROM partition layout.
    platforms:
      - platform: m5stack:esp32
        platform_index_url: https://static-cdn.m5stack.com/resource/arduino/package_m5stack_index.json
    libraries:
      - M5Cardputer (1.1.1)
      - M5Unified (0.2.15)
      - M5GFX (0.2.21)
      - dir: lib/arduino-nofrendo

default_profile: cardputer
